<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYSTEMQ</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>SYSTEMQ</b><small>SYSTEM TOKO</small></div><nav><button onclick="show('master')">MASTER GLOBAL</button><button onclick="show('inventory')">INVENTORY</button><button onclick="show('report')">LAPORAN</button><button onclick="show('finance')">FINANCE & AKUNTING</button></nav></header>
<main>
<section id="master"><h1>MASTER GLOBAL</h1><p>Kelola seluruh data master yang digunakan bersama oleh semua store.</p>
<div class="filter"><select id="type" onchange="setType(this.value)"><option value="store">STORE</option><option value="guide">GUIDE</option><option value="supplier">SUPPLIER</option><option value="brand">BRAND</option><option value="spare">SPARE</option><option value="color">WARNA</option><option value="size">KOLOM SIZE</option><option value="product">MASTER BARANG</option></select></div>
<div class="toolbar"><button class="orange" onclick="add()">＋ ADD</button><button onclick="edit()">✎ UPDATE</button><button class="red" onclick="del()">🗑 DELETE</button><button onclick="exportData()">⇩ EXPORT EXCEL</button><button onclick="alert('Keluar dari '+title())">← KELUAR</button></div>
<div id="productTools" class="toolbar special hidden"><button>📦 BARANG</button><button class="orange" onclick="add()">＋ REGISTER BARANG</button><button class="red" onclick="del()">🗑 DELETE</button><button onclick="discount()">% UPDATE DISKON</button><label>⇧ IMPORT EXCEL<input type="file" accept=".csv" onchange="importCSV(event)"></label><button onclick="alert('Master diperbarui')">↻ UPDATE NEW MASTER</button></div>
<input id="search" placeholder="Cari data..." oninput="render()"><b id="count"></b><h3 id="tableTitle"></h3>
<div class="table"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="inventory" class="hidden"><h1>INVENTORY</h1><div class="box">Tahap berikutnya: stok per Store.</div></section>
<section id="report" class="hidden"><h1>LAPORAN</h1><div class="box">Modul laporan akan dibangun setelah Inventory.</div></section>
<section id="finance" class="hidden"><h1>FINANCE & AKUNTING</h1><div class="box">Akses nanti menggunakan kode rahasia.</div></section>
</main>
<div id="modal" class="modal hidden"><div class="card"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><form id="form" onsubmit="save(event)"></form></div></div>
<script src="app.js"></script></body></html>
