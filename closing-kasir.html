<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYSTEMQ - Closing Kasir</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1d2833}
header{background:#17212b;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.back-btn{background:transparent;color:#fff;border:1px solid #73808c;border-radius:9px;padding:9px 14px;font-size:15px;cursor:pointer}main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce3e8;border-radius:14px;padding:18px;margin-bottom:16px}h1{font-size:24px;margin:0 0 6px}p{color:#687582}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.denoms{display:grid;grid-template-columns:1fr 120px 140px;gap:10px;align-items:center;margin-bottom:12px}
.denom-label{font-size:20px;font-weight:700;color:#1d2833}
.denom-total{font-size:18px;font-weight:700;color:#1f6f43;background:#edf8f1;border:1px solid #b9dfc6;border-radius:9px;padding:12px;text-align:right}
.denoms input,.grid input,.grid select{padding:12px;border:1px solid #cfd8df;border-radius:9px;font-size:16px;width:100%;box-sizing:border-box}
.total{font-weight:bold}.btn{padding:14px 18px;border:0;border-radius:10px;background:#f58220;color:#fff;font-size:16px;font-weight:bold;width:100%;margin-top:14px}.hidden{display:none}.success{background:#eaf8ef;border:1px solid #b9e2c7;border-radius:12px;padding:16px}.note{background:#fff7e8;border:1px solid #f2d08a;padding:12px;border-radius:10px;font-size:14px}.sales{font-size:22px;font-weight:bold;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.denoms{grid-template-columns:1fr 100px 100px}}
</style></head><body>
<header><button class="back-btn" onclick="goBack()">← Kembali</button><b>CLOSING KASIR</b></header><main>
<div class="card"><h1>Closing Shift</h1><p>Hitung fisik terlebih dahulu. Angka sistem dan selisih tidak ditampilkan sebelum maupun sesudah submit.</p>
<div class="grid"><div><label>Tanggal</label><input id="date" type="date"></div><div><label>Store</label><input id="store" placeholder="Store"></div><div><label>Shift</label><select id="shift"><option value="Shift 1">Shift 1</option><option value="Shift 2">Shift 2</option></select></div><div><label>Leader</label><input id="leader" placeholder="Nama leader"></div></div></div>
<div class="card"><h2>Cash Count</h2>
<div class="denoms" style="margin-bottom:6px">
<div style="font-size:13px;font-weight:bold;color:#687582">PECAHAN</div>
<div style="font-size:13px;font-weight:bold;color:#687582">JUMLAH LEMBAR</div>
<div style="font-size:13px;font-weight:bold;color:#687582;text-align:right">TOTAL</div>
</div>
<div id="denoms"></div><div class="total">TOTAL CASH FISIK: <span id="cashTotal">Rp0</span></div></div>
<div class="card"><h2>Non-Cash Aktual</h2><div class="grid"><div><label>Debit</label><input class="pay" data-k="Debit" type="number" min="0"></div><div><label>Credit</label><input class="pay" data-k="Credit" type="number" min="0"></div><div><label>QRIS</label><input class="pay" data-k="QRIS" type="number" min="0"></div><div><label>Transfer / Lainnya</label><input class="pay" data-k="Transfer" type="number" min="0"></div></div><div style="margin-top:12px"><label>Catatan</label><input id="note" placeholder="Catatan jika diperlukan"></div><button class="btn" onclick="submitClosing()">SUBMIT CLOSING</button></div>
<div id="result" class="card hidden"></div>
</main>
<script>
function goBack(){
  if(document.referrer && history.length > 1){ history.back(); }
  else { window.location.href='./index.html'; }
}
const den=[100000,50000,20000,10000,5000,2000,1000];
const d=document.getElementById('denoms');
const fmt=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
d.innerHTML=den.map(x=>`<div class="denom-label">Rp${x.toLocaleString('id-ID')}</div><input type="number" min="0" value="0" data-den="${x}"><div class="denom-total" id="t${x}">Rp0</div>`).join('');
function calc(){let total=0;document.querySelectorAll('[data-den]').forEach(i=>{let v=(+i.value||0)*(+i.dataset.den);total+=v;document.getElementById('t'+i.dataset.den).textContent=fmt(v)});document.getElementById('cashTotal').textContent=fmt(total);return total}
document.querySelectorAll('[data-den]').forEach(i=>i.addEventListener('input',calc));
function tx(){try{return JSON.parse(localStorage.getItem('systemq_cashier_transactions_v1')||localStorage.getItem('systemq_cashier_sales_v1')||'[]')}catch(e){return[]}}
function shiftSales(date,store,shift){
  let a=tx();
  return a.filter(t=>{
    let dt=String(t.date||t.createdAt||t.timestamp||'').slice(0,10);
    let st=t.storeCode||t.store||t.storeName||'';
    let ts=String(t.shift||'').trim();
    return dt===date
      && (!store||String(st).toLowerCase()===store.toLowerCase())
      && ts===String(shift||'').trim();
  }).reduce((s,t)=>s+(Number(t.grandTotal)||Number(t.total)||Number(t.net)||Number(t.amount)||0),0)
}
function submitClosing(){let date=document.getElementById('date').value,store=document.getElementById('store').value.trim(),shift=document.getElementById('shift').value,leader=document.getElementById('leader').value.trim();if(!date||!store||!leader){alert('Tanggal, Store dan Leader wajib diisi');return}let key='systemq_cashier_closing_v1',arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}if(arr.some(x=>x.date===date&&x.store.toLowerCase()===store.toLowerCase()&&x.shift===shift)){alert('Closing untuk Store, Tanggal dan Shift ini sudah pernah dikirim dan terkunci.');return}let payments={Cash:calc()};document.querySelectorAll('.pay').forEach(i=>payments[i.dataset.k]=+i.value||0);let rec={id:'CLS-'+Date.now(),date,store,shift,leader,payments,note:document.getElementById('note').value,submittedAt:new Date().toISOString()};arr.push(rec);localStorage.setItem(key,JSON.stringify(arr));let sales=shiftSales(date,store,shift);let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<div class="success"><b>✓ CLOSING BERHASIL DIKIRIM</b><br><br>Store: ${store}<br>${shift}<br>Leader: ${leader}<div class="sales">Total Penjualan Shift: ${fmt(sales)}</div><p>Perbandingan fisik vs sistem dan selisih hanya dapat dilihat Staff Finance/Office.</p></div>`;document.querySelectorAll('input,select,.btn').forEach(x=>x.disabled=true)}
document.getElementById('date').value=new Date().toISOString().slice(0,10);
</script>
<!-- SYSTEMQ CLOUD LIVE SYNC -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
var SYSTEMQ_SUPABASE_URL='https://jyqheupnegdrdbtpojhl.supabase.co';
var SYSTEMQ_SUPABASE_KEY='sb_publishable_m86qfyYUEvp6cIi3VMG3Cw_iY-5t9ds';
var SYSTEMQ_KEYS=[
 'systemq_v17_data',
 'systemq_inventory_goods_receiving_v1',
 'systemq_inventory_stock_v1',
 'systemq_inventory_stock_movement_v1',
 'systemq_cashier_sales_v1',
 'systemq_cashier_transactions_v1',
 'systemq_customer_database_v1',
 'systemq_cashier_closing_v1',
 'systemq_finance_entries_v1',
 'systemq_finance_accounts_v1',
 'systemq_supplier_payments_v1'
];
var sb=null, ready=false, applying=false, timer=null;
function snapshot(){var data={};SYSTEMQ_KEYS.forEach(function(k){var v=localStorage.getItem(k);if(v!==null)data[k]=v;});return data;}
function apply(payload){if(!payload||typeof payload!=='object')return;applying=true;SYSTEMQ_KEYS.forEach(function(k){if(Object.prototype.hasOwnProperty.call(payload,k))localStorage.setItem(k,String(payload[k]));else localStorage.removeItem(k);});applying=false;}
async function pull(){if(!sb)return false;var r=await sb.from('systemq_sync').select('payload').eq('sync_key','global').maybeSingle();if(r.error)throw r.error;if(r.data&&r.data.payload){apply(r.data.payload);return true;}return false;}
async function push(){if(!sb||applying)return;var payload=snapshot();var r=await sb.from('systemq_sync').upsert({sync_key:'global',payload:payload,updated_at:new Date().toISOString()},{onConflict:'sync_key'});if(r.error)console.warn('SYSTEMQ cloud sync:',r.error.message);}
function queuePush(){if(applying)return;clearTimeout(timer);timer=setTimeout(function(){push().catch(function(e){console.warn(e);});},350);}
async function boot(){if(!window.supabase||!window.supabase.createClient)return;sb=window.supabase.createClient(SYSTEMQ_SUPABASE_URL,SYSTEMQ_SUPABASE_KEY);try{var hasCloud=await pull();if(!hasCloud)await push();else if(sessionStorage.getItem('systemq_cloud_boot')!=='1'){sessionStorage.setItem('systemq_cloud_boot','1');location.reload();return;}ready=true;var originalSet=localStorage.setItem.bind(localStorage),originalRemove=localStorage.removeItem.bind(localStorage);localStorage.setItem=function(k,v){originalSet(k,v);if(SYSTEMQ_KEYS.indexOf(k)!==-1)queuePush();};localStorage.removeItem=function(k){originalRemove(k);if(SYSTEMQ_KEYS.indexOf(k)!==-1)queuePush();};sb.channel('systemq-live-sync').on('postgres_changes',{event:'*',schema:'public',table:'systemq_sync',filter:'sync_key=eq.global'},function(payload){if(!ready)return;var row=payload.new&&payload.new.payload?payload.new:payload.old;if(row&&row.payload){apply(row.payload);window.dispatchEvent(new Event('systemq-cloud-sync'));}}).subscribe();window.dispatchEvent(new Event('systemq-cloud-ready'));}catch(e){console.warn('SYSTEMQ berjalan offline/local:',e&&e.message?e.message:e);}}
boot();
})();
</script>

</body></html>
