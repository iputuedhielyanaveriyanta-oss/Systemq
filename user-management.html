<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYSTEMQ • Manajemen User</title>
<style>
body{margin:0;background:#f5f7f9;color:#17212b;font-family:Arial,sans-serif}
header{padding:18px 22px;background:#18222d;color:#fff;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px}header small{display:block;opacity:.65;margin-top:3px}
main{max-width:1050px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#18222d;color:#fff}
.btn.orange{background:#ef7f1a}.btn.gray{background:#687582}
.card{background:#fff;border:1px solid #dfe5ea;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #edf0f2;text-align:left;font-size:14px}
th{color:#687582;font-size:12px}
input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd5dc;border-radius:10px;font-size:15px;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:15px;z-index:1000}
.modal .card{width:min(560px,96vw)}label{font-size:13px;font-weight:700}
.status{font-size:12px;padding:5px 8px;border-radius:99px;background:#e9f7ef;color:#17753d}.off{background:#fdeaea;color:#b22}
.msg{margin:10px 0;padding:10px;border-radius:9px;display:none}.msg.err{display:block;background:#fdeaea;color:#b22}.msg.ok{display:block;background:#e9f7ef;color:#17753d}
@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hide-mobile{display:none}}
</style>
</head>
<body>
<header>
  <div><b>SYSTEMQ</b><small>USER MANAGEMENT • OWNER ONLY</small></div>
  <button class="btn gray" onclick="location.href='./index.html'">← DASHBOARD</button>
</header>

<main>
  <div class="top">
    <div><h1 style="margin:0">Manajemen User</h1><p style="color:#687582">Tambah dan kelola akun staff SYSTEMQ.</p></div>
    <button class="btn orange" onclick="openAdd()">＋ TAMBAH USER</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="card">
    <table>
      <thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th class="hide-mobile">Dibuat</th><th>Aksi</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<div id="modal" class="modal hidden">
  <div class="card">
    <h2 id="mt">Tambah User</h2>
    <div class="grid">
      <label>Nama<input id="name"></label>
      <label>Email<input id="email" type="email"></label>
      <label id="passwordWrap">Password<input id="password" type="password" minlength="6" placeholder="Minimal 6 karakter"></label>
      <label>Role<select id="role">
        <option>STAFF</option><option>LEADER</option><option>CASHIER</option>
        <option>FINANCE</option><option>INVENTORY</option>
      </select></label>
    </div>
    <div id="formMsg" class="msg"></div>
    <div class="actions" style="margin-top:16px">
      <button class="btn orange" id="saveBtn" onclick="saveUser()">SIMPAN USER</button>
      <button class="btn gray" onclick="closeModal()">BATAL</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG={url:'https://jyqheupnegdrdbtpojhl.supabase.co',key:'sb_publishable_m86qfyYUEvp6cIi3VMG3Cw_iY-5t9ds'};
let sb=null, profiles=[];

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(t,k='ok'){let e=document.getElementById('msg');e.textContent=t;e.className='msg '+k}
function fm(t,k){let e=document.getElementById('formMsg');e.textContent=t;e.className='msg '+k}

function getOwner(){
  const keys=['systemq_bootstrap_owner','systemq_auth_user'];
  for(const key of keys){
    try{
      const u=JSON.parse(sessionStorage.getItem(key)||'null');
      if(u && String(u.role||'').toUpperCase()==='OWNER' &&
        String(u.email||'').toLowerCase()==='owner@systemq.com') return u;
    }catch(e){}
  }
  return null;
}

function renderUsers(users){
  const body=document.getElementById('rows');
  body.innerHTML=users.map(u=>{
    const active=u.is_active!==false;
    const owner=String(u.role||'').toUpperCase()==='OWNER';
    return `<tr>
      <td><b>${esc(u.full_name||u.name||'-')}</b></td>
      <td>${esc(u.email||'-')}</td>
      <td>${esc(u.role||'STAFF')}</td>
      <td><span class="status ${active?'':'off'}">${active?'AKTIF':'NONAKTIF'}</span></td>
      <td class="hide-mobile">${u.created_at?new Date(u.created_at).toLocaleDateString('id-ID'):'-'}</td>
      <td>${owner?'-':`<div class="actions">
        <button class="btn gray" onclick="editUser('${esc(u.id)}')">EDIT</button>
        <button class="btn gray" onclick="toggleUser('${esc(u.id)}',${active?'false':'true'})">${active?'NONAKTIFKAN':'AKTIFKAN'}</button>
      </div>`}</td>
    </tr>`;
  }).join('');
}

async function loadUsers(){
  const users=[{
    id:'systemq-owner',
    full_name:'SYSTEMQ OWNER',
    email:'owner@systemq.com',
    role:'OWNER',
    is_active:true,
    created_at:''
  }];

  if(sb){
    try{
      const r=await sb.from('systemq_user_profiles').select('*').order('created_at',{ascending:true});
      if(!r.error && Array.isArray(r.data)){
        profiles=r.data.filter(x=>String(x.email||'').toLowerCase()!=='owner@systemq.com');
        users.push(...profiles);
      }
    }catch(e){}
  }
  renderUsers(users);
}

function openAdd(){
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('mt').textContent='Tambah User';
  ['name','email','password'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('email').disabled=false;
  document.getElementById('passwordWrap').style.display='block';
  document.getElementById('role').value='STAFF';
  document.getElementById('saveBtn').onclick=saveUser;
  document.getElementById('saveBtn').textContent='SIMPAN USER';
  fm('','');
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

async function saveUser(){
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const role=document.getElementById('role').value;

  if(!name||!email||!password){fm('Nama, email dan password wajib diisi.','err');return}
  if(password.length<6){fm('Password minimal 6 karakter.','err');return}

  const b=document.getElementById('saveBtn'); b.disabled=true; b.textContent='MEMBUAT...';
  try{
    const secondary=window.supabase.createClient(CFG.url,CFG.key,{
      auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
    });
    const r=await secondary.auth.signUp({
      email,password,options:{data:{full_name:name,role:role}}
    });
    if(r.error) throw r.error;

    const uid=r.data.user&&r.data.user.id;
    if(uid && sb){
      const up=await sb.from('systemq_user_profiles').upsert({
        id:uid,email,full_name:name,role,is_active:true
      });
      if(up.error) throw up.error;
    }

    closeModal(); say('User berhasil dibuat: '+email,'ok'); await loadUsers();
  }catch(e){
    fm(e.message||'Gagal membuat user.','err');
  }finally{
    b.disabled=false;b.textContent='SIMPAN USER';
  }
}

function editUser(id){
  const x=profiles.find(v=>String(v.id)===String(id));
  if(!x)return;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('mt').textContent='Edit User';
  document.getElementById('name').value=x.full_name||x.name||'';
  document.getElementById('email').value=x.email||'';
  document.getElementById('email').disabled=true;
  document.getElementById('passwordWrap').style.display='none';
  document.getElementById('role').value=x.role||'STAFF';

  const b=document.getElementById('saveBtn');
  b.textContent='SIMPAN PERUBAHAN';
  b.onclick=async()=>{
    const r=await sb.from('systemq_user_profiles').update({
      full_name:document.getElementById('name').value.trim(),
      role:document.getElementById('role').value
    }).eq('id',id);
    if(r.error){fm(r.error.message,'err');return}
    closeModal(); await loadUsers(); say('User berhasil diperbarui.');
  };
}

async function toggleUser(id,active){
  if(!sb){say('Koneksi user belum siap.','err');return}
  const r=await sb.from('systemq_user_profiles').update({is_active:active}).eq('id',id);
  if(r.error){say(r.error.message,'err');return}
  await loadUsers();
  say(active?'User diaktifkan.':'User dinonaktifkan.');
}

function init(){
  const owner=getOwner();
  if(!owner){
    location.replace('./login.html');
    return;
  }

  // Owner row tampil terlebih dahulu, jadi halaman tidak pernah kosong.
  renderUsers([{
    id:'systemq-owner',
    full_name:'SYSTEMQ OWNER',
    email:'owner@systemq.com',
    role:'OWNER',
    is_active:true
  }]);

  try{
    sb=window.supabase.createClient(CFG.url,CFG.key,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    });
  }catch(e){sb=null}

  loadUsers();
}
init();
</script>
</body>
</html>
